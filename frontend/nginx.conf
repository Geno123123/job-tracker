server {
    listen 80;
    server_name geno-jobtracker.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name geno-jobtracker.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/geno-jobtracker.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geno-jobtracker.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}